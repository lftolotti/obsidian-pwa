<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cérebro">
  <title>Segundo Cérebro</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <style>
    /* ─── Tokens ────────────────────────────────────────────────────── */
    :root {
      --bg:          #000000;
      --bg-2:        #1c1c1e;
      --glass:       rgba(28, 28, 30, 0.82);
      --glass-b:     rgba(255, 255, 255, 0.09);
      --glass-sep:   rgba(84, 84, 88, 0.55);
      --label:       #ffffff;
      --label-2:     rgba(235, 235, 245, 0.60);
      --label-3:     rgba(235, 235, 245, 0.30);
      --label-4:     rgba(235, 235, 245, 0.14);
      --fill-2:      rgba(120, 120, 128, 0.22);
      --green:       #30d158;
      --red:         #ff453a;
      --yellow:      #ffd60a;
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
      --t:       180ms cubic-bezier(0.4, 0, 0.2, 1);
      --t-s:     420ms cubic-bezier(0.34, 1.46, 0.64, 1);
    }

    /* ─── Reset ─────────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    html { height: 100%; }

    body {
      background: var(--bg);
      color: var(--label);
      font-family: var(--font);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ─── Scroll Area ────────────────────────────────────────────────── */
    .scroll-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: clip;
      -webkit-overflow-scrolling: touch;
      padding-top: 0;
      padding-bottom: calc(60px + var(--safe-bot) + 40px);
      padding-left: 24px;
      padding-right: 24px;
    }

    /* ─── Home top row ───────────────────────────────────────────────── */
    .home-toprow {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding-top: calc(var(--safe-top) + 16px);
      padding-bottom: 20px;
    }

    .refresh-btn {
      background: none;
      border: none;
      color: var(--label-3);
      font-size: 22px;
      cursor: pointer;
      padding: 4px 0;
      margin-top: 6px;
      -webkit-tap-highlight-color: transparent;
    }

    /* ─── Panels ─────────────────────────────────────────────────────── */
    .panel { display: none; }
    .panel.active { display: block; }
    .panel.slide-left  { animation: slideLeft  0.26s cubic-bezier(0.4,0,0.2,1) both; }
    .panel.slide-right { animation: slideRight 0.26s cubic-bezier(0.4,0,0.2,1) both; }

    @keyframes slideLeft  { from { opacity:0; transform:translateX(24px); } to { opacity:1; transform:translateX(0); } }
    @keyframes slideRight { from { opacity:0; transform:translateX(-24px); } to { opacity:1; transform:translateX(0); } }

    /* ─── Sticky Header (Large Title + Save Btn) ─────────────────────── */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding-top: calc(var(--safe-top) + 16px);
      padding-bottom: 20px;
      background: var(--bg);
    }

    .large-title {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    /* ─── Save Button ────────────────────────────────────────────────── */
    .save-btn {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.10);
      border: 0.5px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      color: var(--label);
      font-family: var(--font);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      margin-top: 6px;
    }

    .save-btn:active:not(:disabled) { opacity: 0.6; }
    .save-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ─── Sections ───────────────────────────────────────────────────── */
    .section { margin-bottom: 28px; }

    .section-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--label-3);
      margin-bottom: 7px;
      padding-left: 4px;
    }

    .section-body {
      background: var(--bg-2);
      border-radius: 12px;
      overflow: hidden;
      border: 0.5px solid var(--glass-b);
    }

    /* ─── Cells ──────────────────────────────────────────────────────── */
    .cell {
      display: flex;
      align-items: center;
      min-height: 44px;
      padding: 0 14px;
      position: relative;
    }

    .cell + .cell::before {
      content: '';
      position: absolute;
      top: 0; left: 14px; right: 0;
      height: 0.5px;
      background: var(--glass-sep);
    }

    .date-chip {
      flex-shrink: 0;
      margin-left: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px 4px 7px;
      background: var(--fill-2);
      border: 0.5px solid var(--glass-b);
      border-radius: 20px;
      color: var(--label-2);
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background var(--t), color var(--t);
      white-space: nowrap;
    }

    .date-chip:active { background: rgba(255,255,255,0.14); color: var(--label); }
    .date-chip-icon { font-size: 13px; line-height: 1; }

    /* Hidden date input — triggered by chip */
    .date-input-hidden {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    /* ─── Inputs ─────────────────────────────────────────────────────── */
    .cell-input,
    .cell-textarea,
    .cell-select {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--label);
      font-family: var(--font);
      font-size: 15px;
      padding: 12px 0;
      width: 100%;
      caret-color: var(--label);
    }

    .cell-input::placeholder,
    .cell-textarea::placeholder { color: var(--label-4); }

    .cell-textarea {
      resize: none;
      min-height: 130px;
      line-height: 1.55;
    }

    .cell-select {
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }
    .cell-select option { background: var(--bg-2); }

    .cell-chevron {
      color: var(--label-3);
      margin-left: 8px;
      flex-shrink: 0;
    }

    .cell.cell-tall { align-items: flex-start; padding-top: 0; padding-bottom: 0; }

    /* ─── Chips ──────────────────────────────────────────────────────── */
    .chips-section .section-body { padding: 12px; }

    .chips-wrap { display: flex; flex-wrap: wrap; gap: 7px; }

    .chip {
      padding: 5px 13px;
      background: var(--fill-2);
      border: 0.5px solid var(--glass-b);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      color: var(--label-2);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform var(--t-s), background var(--t), color var(--t), border-color var(--t);
    }

    .chip:active { transform: scale(0.92); }

    .chip.selected {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.35);
      color: var(--label);
      transform: scale(1.03);
    }

    .chips-empty { font-size: 13px; color: var(--label-3); }

    /* ─── File Drop ──────────────────────────────────────────────────── */
    .file-drop {
      background: var(--bg-2);
      border-radius: 12px;
      border: 1.5px dashed var(--glass-sep);
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color var(--t), background var(--t);
      -webkit-tap-highlight-color: transparent;
    }

    .file-drop.has-file, .file-drop:active {
      border-color: rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.04);
    }

    .file-drop input[type="file"] { display: none; }
    .file-drop-icon { font-size: 30px; margin-bottom: 8px; }
    .file-drop-text { font-size: 15px; font-weight: 500; color: var(--label-2); }
    .file-drop-hint { font-size: 12px; color: var(--label-3); margin-top: 4px; }
    .file-drop-name { font-size: 14px; font-weight: 600; color: var(--label); margin-top: 8px; display: none; }

    /* ─── New category ───────────────────────────────────────────────── */
    .new-cat-wrap { display: none; margin-top: 10px; }
    .new-cat-wrap.show { display: block; }

    .section-footnote {
      font-size: 12px;
      color: var(--label-3);
      padding: 7px 4px 0;
      line-height: 1.6;
    }

    .section-footnote code {
      background: var(--fill-2);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 11px;
      color: var(--label-2);
    }

    /* ─── Status dot & card ──────────────────────────────────────────── */
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.ok      { background: var(--green); box-shadow: 0 0 5px var(--green); }
    .status-dot.err     { background: var(--red); }
    .status-dot.pending { background: var(--yellow); animation: pulse 1.8s ease infinite; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    .status-card {
      background: var(--bg-2);
      border-radius: 12px;
      border: 0.5px solid var(--glass-b);
      padding: 13px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .status-card-title { font-size: 15px; font-weight: 600; }
    .status-card-sub   { font-size: 12px; color: var(--label-3); margin-top: 2px; }

    /* Token input */
    .token-wrap { position: relative; flex: 1; display: flex; }
    .token-wrap .cell-input { padding-right: 36px; }
    .token-eye {
      position: absolute; right: 0; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--label-3); cursor: pointer; padding: 8px; line-height: 0;
    }

    /* ─── TO DO cards ───────────────────────────────────────────────── */
    .todo-card {
      background: var(--bg-2);
      border-radius: 14px;
      border: 0.5px solid var(--glass-b);
      padding: 14px 14px 14px 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .radio-btn {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 1.5px solid var(--label-3);
      flex-shrink: 0;
      margin-top: 1px;
      transition: background var(--t), border-color var(--t);
      display: flex; align-items: center; justify-content: center;
    }

    .radio-btn.checked {
      background: var(--green);
      border-color: var(--green);
    }

    .radio-btn.checked::after {
      content: '';
      width: 7px; height: 7px;
      background: #000;
      border-radius: 50%;
    }

    .todo-body { flex: 1; min-width: 0; }

    .todo-text {
      font-size: 15px;
      color: var(--label);
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .todo-text.done {
      text-decoration: line-through;
      color: var(--label-3);
    }

    .todo-tags { display: flex; flex-wrap: wrap; gap: 5px; }

    .todo-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      white-space: nowrap;
    }

    .todo-tag.project {
      background: rgba(255,255,255,0.08);
      color: var(--label-2);
    }

    .todo-tag.person {
      background: rgba(255,255,255,0.05);
      color: var(--label-3);
    }

    /* ─── Nav cards ──────────────────────────────────────────────────── */
    .nav-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .nav-card {
      background: var(--bg-2);
      border-radius: 16px;
      border: 0.5px solid var(--glass-b);
      padding: 18px 16px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background var(--t);
    }

    .nav-card:active { background: rgba(255,255,255,0.06); }

    .nav-card-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--label-3);
      margin-bottom: 6px;
    }

    .nav-card-count {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--label);
      line-height: 1;
    }

    .nav-card-arrow {
      font-size: 14px;
      color: var(--label-3);
      margin-top: 8px;
    }

    /* ─── Sheet list / detail ────────────────────────────────────────── */
    .sheet-back {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--label-2);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      margin-bottom: 20px;
      padding: 4px 0;
    }

    .sheet-list-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 20px;
    }

    .sheet-list-item {
      padding: 14px 0;
      border-bottom: 0.5px solid var(--glass-sep);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .sheet-list-item:last-child { border-bottom: none; }

    .sheet-list-item-main { flex: 1; min-width: 0; }
    .sheet-list-item-name { font-size: 15px; color: var(--label); font-weight: 500; }
    .sheet-list-item-sub  { font-size: 12px; color: var(--label-3); margin-top: 2px; }
    .sheet-list-chevron   { color: var(--label-3); font-size: 16px; margin-left: 8px; flex-shrink: 0; }

    /* Detail inside sheet */
    .sheet-detail-name    { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 4px; }
    .sheet-detail-role    { font-size: 14px; color: var(--label-2); margin-bottom: 2px; }
    .sheet-detail-meta    { font-size: 13px; color: var(--label-3); margin-bottom: 18px; }
    .sheet-detail-body    { font-size: 14px; color: var(--label-2); line-height: 1.7; white-space: pre-wrap; }

    /* ─── Home cards ─────────────────────────────────────────────────── */
    .home-section-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--label-3);
      margin-bottom: 10px;
      padding-left: 2px;
    }

    .home-section { margin-bottom: 32px; }

    .week-card {
      background: var(--bg-2);
      border-radius: 16px;
      border: 0.5px solid var(--glass-b);
      padding: 18px;
      position: relative;
    }

    .week-card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--label);
      margin-bottom: 12px;
    }

    .week-card-body {
      font-size: 14px;
      color: var(--label-2);
      line-height: 1.65;
    }

    .week-card-body h2 {
      font-size: 13px;
      font-weight: 700;
      color: var(--label);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 14px 0 6px;
    }

    .week-card-body h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--label);
      margin: 10px 0 4px;
    }

    .week-card-body ul { padding-left: 16px; }
    .week-card-body li { margin-bottom: 4px; }
    .week-card-body strong { color: var(--label); font-weight: 600; }
    .week-card-body hr { border: none; border-top: 0.5px solid var(--glass-sep); margin: 12px 0; }

    .empty-state {
      text-align: center;
      padding: 32px 20px;
      color: var(--label-3);
      font-size: 14px;
      line-height: 1.6;
    }

    .empty-icon { font-size: 36px; margin-bottom: 12px; }

    /* Subsection label (EM ANDAMENTO, FINALIZADOS…) */
    .subsection-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--label-3);
      margin: 18px 0 8px 2px;
    }

    /* Lembretes card */
    .lembretes-card {
      background: var(--bg-2);
      border-radius: 14px;
      border: 0.5px solid var(--glass-b);
      padding: 14px 16px;
      margin-bottom: 28px;
    }

    .lembrete-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 6px 0;
      font-size: 14px;
      color: var(--label-2);
      line-height: 1.45;
      border-bottom: 0.5px solid var(--glass-sep);
    }

    .lembrete-item:last-child { border-bottom: none; }

    .lembrete-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--label-3);
      margin-top: 5px;
      flex-shrink: 0;
    }

    /* Task count badge */
    .task-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      margin-top: 6px;
      display: inline-block;
    }

    .task-badge.open     { background: rgba(255,69,58,0.12);  color: #ff6b60; }
    .task-badge.done     { background: rgba(48,209,88,0.12);  color: #30d158; }
    .task-badge.none     { background: var(--fill-2);          color: var(--label-3); }

    /* People grid */
    .people-grid-home {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .person-card {
      background: var(--bg-2);
      border-radius: 14px;
      border: 0.5px solid var(--glass-b);
      padding: 14px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }

    .person-card:active { background: rgba(255,255,255,0.06); }

    .person-card-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--label);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .person-card-role {
      font-size: 11px;
      color: var(--label-3);
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .person-card-rel {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--fill-2);
      color: var(--label-3);
    }

    .person-card-rel.chefe      { background: rgba(255,69,58,0.12);  color: #ff6b60; }
    .person-card-rel.liderada,
    .person-card-rel.liderado   { background: rgba(48,209,88,0.12);  color: #30d158; }
    .person-card-rel.par        { background: rgba(255,255,255,0.08); color: var(--label-2); }
    .person-card-rel.stakeholder{ background: rgba(255,214,10,0.10); color: #ffd60a; }

    /* Person detail sheet */
    .person-sheet {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      align-items: flex-end;
    }

    .person-sheet.open { display: flex; }

    .person-sheet-inner {
      background: var(--bg-2);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-height: 80dvh;
      overflow-y: auto;
      padding: 20px 24px calc(var(--safe-bot) + 24px);
      animation: sheetUp 0.3s cubic-bezier(0.4,0,0.2,1);
    }

    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .sheet-handle {
      width: 36px; height: 4px;
      background: var(--glass-sep);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .sheet-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    .sheet-role {
      font-size: 14px;
      color: var(--label-2);
      margin-bottom: 4px;
    }

    .sheet-company {
      font-size: 13px;
      color: var(--label-3);
      margin-bottom: 18px;
    }

    .sheet-body {
      font-size: 14px;
      color: var(--label-2);
      line-height: 1.7;
      white-space: pre-wrap;
    }

    /* ─── Tab Bar — Floating Glass Pill ─────────────────────────────── */
    .tabbar {
      position: fixed;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      width: calc(100% - 48px);
      max-width: 380px;
      height: 60px;
      border-radius: 30px;
      background: rgba(30, 30, 36, 0.78);
      backdrop-filter: blur(32px) saturate(200%);
      -webkit-backdrop-filter: blur(32px) saturate(200%);
      border: 0.5px solid rgba(255,255,255,0.13);
      box-shadow: 0 12px 40px rgba(0,0,0,0.55), 0 4px 12px rgba(0,0,0,0.30),
                  inset 0 0.5px 0 rgba(255,255,255,0.10);
      display: flex;
      align-items: center;
      padding: 0 8px;
    }

    .tab-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 48px;
      border-radius: 24px;
      background: none;
      border: none;
      color: rgba(235,235,245,0.38);
      font-family: var(--font);
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color var(--t), background var(--t);
      position: relative;
    }

    .tab-btn svg {
      width: 22px; height: 22px;
      stroke-width: 1.6;
      transition: transform var(--t-s), filter var(--t);
    }

    .tab-btn.active { color: var(--label); background: rgba(255,255,255,0.10); }
    .tab-btn.active svg { transform: scale(1.08); filter: drop-shadow(0 0 4px rgba(255,255,255,0.25)); }
    .tab-btn:active:not(.active) { background: rgba(255,255,255,0.06); }

    /* ─── Config badge ───────────────────────────────────────────────── */
    .tab-icon-wrap { position: relative; display: inline-flex; }

    .cfg-badge {
      position: absolute;
      top: -2px; right: -3px;
      width: 7px; height: 7px;
      background: var(--red);
      border-radius: 50%;
      border: 1.5px solid #1e1e24;
      display: none;
    }

    .cfg-badge.show { display: block; }

    /* ─── Spinner ────────────────────────────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(0,0,0,0.25);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Toast ──────────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: calc(60px + var(--safe-bot) + 26px);
      left: 24px; right: 24px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      z-index: 500;
      text-align: center;
      opacity: 0;
      transform: translateY(8px) scale(0.97);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .toast.show { opacity: 1; transform: translateY(0) scale(1); }
    .toast.success { background: rgba(48,209,88,0.15); border: 0.5px solid rgba(48,209,88,0.4); color: var(--green); }
    .toast.error   { background: rgba(255,69,58,0.15);  border: 0.5px solid rgba(255,69,58,0.4);  color: var(--red); }
  </style>
</head>
<body>

    <button class="tab-btn" id="tab-config" onclick="switchTab('config')">
      <div class="tab-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>

  <div class="toast" id="toast"></div>

  <script>
    const REPO     = 'lftolotti/segundo-cerebro';
    const API_BASE = 'https://api.github.com';

    let currentFile = null;
    const TAB_ORDER = ['home', 'nota', 'pdf', 'config'];
    let currentTab  = 'home';
    let peopleData  = [];

    // ── Init ─────────────────────────────────────────────────────────
    async function init() {
      initDateChip();
      const tok = localStorage.getItem('gh_token');
      if (tok) {
        document.getElementById('gh-token').value = tok;
        await checkConnection();
        loadHome();
      } else {
        setStatus('err', 'Token não configurado');
      }
    }

    // ── Home ─────────────────────────────────────────────────────────
    const CACHE_KEY = 'cerebro_home_v3';
    const CACHE_TTL = 60 * 60 * 1000;

    // Rank de relação para ordenar pessoas nos TO DOs
    const REL_RANK = { 'chefe': 0, 'stakeholder': 1, 'par': 2, 'liderada': 3, 'liderado': 3 };

    let _homeData = null;
    let _checkedTodos = new Set();

    async function loadHome(forceRefresh = false) {
      if (!token()) { setHomePlaceholder('Configure o token em Config'); return; }
      setHomePlaceholder('Carregando...');

      if (!forceRefresh) {
        const cached = getHomeCache();
        if (cached) { _homeData = cached; renderHome(cached); return; }
      }

      try {
        const [owner, repo] = REPO.split('/');
        const data = await ghGraphQL(`{
          repository(owner: "${owner}", name: "${repo}") {
            pessoas:  object(expression: "main:PESSOAS")  { ... on Tree { entries { name object { ... on Blob { text } } } } }
            projetos: object(expression: "main:PROJETOS") { ... on Tree { entries { name object { ... on Blob { text } } } } }
            reunioes: object(expression: "main:REUNIOES") { ... on Tree { entries { name object { ... on Blob { text } } } } }
            notas:    object(expression: "main:NOTAS")    { ... on Tree { entries { name object { ... on Blob { text } } } } }
          }
        }`);

        const pessoas  = parsePessoas(data);
        const projetos = parseProjetos(data);
        const todos    = extractTodos(data, pessoas);
        const payload  = { pessoas, projetos, todos };
        setHomeCache(payload);
        _homeData = payload;
        renderHome(payload);
      } catch(e) {
        setHomePlaceholder('Erro ao carregar — toque ↻ pra tentar de novo');
      }
    }

    function setHomePlaceholder(msg) {
      document.getElementById('home-todos').innerHTML = `<div class="empty-state"><div class="empty-icon">🧠</div>${msg}</div>`;
      document.getElementById('home-nav').innerHTML   = '';
    }

    // ── Parsers ───────────────────────────────────────────────────────
    function parsePessoas(data) {
      return (data.repository.pessoas?.entries || [])
        .filter(e => e.name.endsWith('.md') && !e.name.startsWith('Exemplo') && e.object?.text)
        .map(e => ({
          name: e.name.replace('.md',''),
          fm:   parseFrontmatter(e.object.text),
          ctx:  parseSection(e.object.text, 'Contexto')
        }))
        .sort((a,b) => a.name.localeCompare(b.name,'pt'));
    }

    function parseProjetos(data) {
      return (data.repository.projetos?.entries || [])
        .filter(e => e.name.endsWith('.md') && !e.name.startsWith('Exemplo') && e.object?.text)
        .map(e => ({
          name:     e.name.replace('.md',''),
          fm:       parseFrontmatter(e.object.text),
          ctx:      parseSection(e.object.text, 'Contexto') || parseSection(e.object.text, 'Objetivo'),
          open:     (e.object.text.match(/- \[ \]/g)  || []).length,
          done:     (e.object.text.match(/- \[x\]/gi) || []).length
        }))
        .sort((a,b) => a.name.localeCompare(b.name,'pt'));
    }

    function extractTodos(data, pessoas) {
      const todos     = [];
      const pessoaNames = pessoas.map(p => p.name);
      const sources   = ['projetos','reunioes','notas'];

      sources.forEach(src => {
        (data.repository[src]?.entries || []).forEach(e => {
          if (!e.object?.text) return;
          const lines     = e.object.text.split('\n');
          const srcLabel  = e.name.replace('.md','').replace(/^\d{4}-\d{2}-\d{2} - /,'');

          lines.forEach((line, i) => {
            if (!/^- \[ \]/.test(line)) return;
            const text = line.replace(/^- \[ \]\s*/,'').trim();

            // Busca menções [[Pessoa]] em contexto ±5 linhas
            const ctx = lines.slice(Math.max(0,i-5), i+6).join('\n');
            const mentioned = [...ctx.matchAll(/\[\[([^\]]+)\]\]/g)]
              .map(m => m[1])
              .filter(n => pessoaNames.includes(n));

            // Rankeia as pessoas mencionadas
            const rankedPeople = [...new Set(mentioned)]
              .map(n => pessoas.find(p => p.name === n))
              .filter(Boolean)
              .sort((a,b) => (REL_RANK[a.fm.relacao?.toLowerCase()]??9) - (REL_RANK[b.fm.relacao?.toLowerCase()]??9));

            todos.push({ text, source: srcLabel, people: rankedPeople, id: `${src}:${i}:${e.name}` });
          });
        });
      });
      return todos;
    }

    // ── Render ────────────────────────────────────────────────────────
    function renderHome({ pessoas, projetos, todos }) {
      renderNavCards(projetos, pessoas);
      renderTodos(todos);
    }

    function renderTodos(todos) {
      const el = document.getElementById('home-todos');
      if (!todos?.length) {
        el.innerHTML = `
          <div class="home-section-label" style="margin-top:32px">TO DOs</div>
          <div class="empty-state" style="padding:24px 0">
            <div class="empty-icon">✅</div>
            Nenhuma tarefa aberta no vault ainda.
          </div>`;
        return;
      }

      el.innerHTML = `
        <div class="home-section-label">TO DOs</div>
        ${todos.map((t,i) => `
          <div class="todo-card" onclick="toggleTodo(${i})">
            <div class="radio-btn${_checkedTodos.has(t.id) ? ' checked' : ''}" id="radio-${i}"></div>
            <div class="todo-body">
              <div class="todo-text${_checkedTodos.has(t.id) ? ' done' : ''}">${t.text}</div>
              <div class="todo-tags">
                <span class="todo-tag project">${t.source}</span>
                ${t.people.map(p => `<span class="todo-tag person">${p.name}</span>`).join('')}
              </div>
            </div>
          </div>`).join('')}`;
    }

    function renderNavCards(projetos, pessoas) {
      document.getElementById('home-nav').innerHTML = `
        <div class="home-section-label">Explorar</div>
        <div class="nav-cards">
          <div class="nav-card" onclick="openListSheet('projetos')">
            <div class="nav-card-label">Projetos</div>
            <div class="nav-card-count">${projetos?.length || 0}</div>
            <div class="nav-card-arrow">→</div>
          </div>
          <div class="nav-card" onclick="openListSheet('pessoas')">
            <div class="nav-card-label">Pessoas</div>
            <div class="nav-card-count">${pessoas?.length || 0}</div>
            <div class="nav-card-arrow">→</div>
          </div>
        </div>`;
    }

    function toggleTodo(i) {
      haptic(6);
      const todos = _homeData?.todos || [];
      const t = todos[i];
      if (!t) return;
      _checkedTodos.has(t.id) ? _checkedTodos.delete(t.id) : _checkedTodos.add(t.id);
      document.getElementById(`radio-${i}`)?.classList.toggle('checked');
      document.querySelectorAll('.todo-card')[i]?.querySelector('.todo-text')?.classList.toggle('done');
    }

    // ── Sheet navigation ──────────────────────────────────────────────
    function openListSheet(type) {
      haptic(8);
      const data     = _homeData;
      const isProj   = type === 'projetos';
      const items    = isProj ? data?.projetos : data?.pessoas;
      const title    = isProj ? 'Projetos' : 'Pessoas';

      document.getElementById('sheet-dynamic').innerHTML = `
        <div class="sheet-list-title">${title}</div>
        ${!items?.length
          ? '<div style="color:var(--label-3);font-size:14px">Nenhum item ainda.</div>'
          : items.map((item, i) => `
            <div class="sheet-list-item" onclick="openDetailSheet('${type}', ${i})">
              <div class="sheet-list-item-main">
                <div class="sheet-list-item-name">${item.name}</div>
                <div class="sheet-list-item-sub">${isProj
                  ? (item.open ? `${item.open} task${item.open>1?'s':''} abertas` : item.done ? '✓ Finalizado' : 'Sem tasks')
                  : (item.fm?.cargo || '')}</div>
              </div>
              <span class="sheet-list-chevron">›</span>
            </div>`).join('')}`;

      document.getElementById('person-sheet').classList.add('open');
    }

    function openDetailSheet(type, i) {
      haptic(6);
      const isProj = type === 'projetos';
      const item   = isProj ? _homeData?.projetos?.[i] : _homeData?.pessoas?.[i];
      if (!item) return;

      const meta = isProj
        ? `${item.open ? item.open + ' tasks abertas' : item.done ? '✓ Finalizado' : 'Sem tasks'} · ${item.fm?.area || 'Projeto'}`
        : `${item.fm?.cargo || ''} · ${item.fm?.empresa || ''}`;

      document.getElementById('sheet-dynamic').innerHTML = `
        <div class="sheet-back" onclick="openListSheet('${type}')">‹ Voltar</div>
        <div class="sheet-detail-name">${item.name}</div>
        <div class="sheet-detail-role">${isProj ? (item.fm?.area || 'Projeto') : (item.fm?.relacao || '')}</div>
        <div class="sheet-detail-meta">${meta}</div>
        <div class="sheet-detail-body">${item.ctx || 'Sem descrição registrada.'}</div>`;
    }

    function getHomeCache() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        const { data, ts } = JSON.parse(raw);
        return (Date.now() - ts < CACHE_TTL) ? data : null;
      } catch { return null; }
    }

    function setHomeCache(data) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ data, ts: Date.now() })); } catch {}
    }

    // ── Sheet close ───────────────────────────────────────────────────
    function closeSheet(e) {
      if (e.target === document.getElementById('person-sheet'))
        document.getElementById('person-sheet').classList.remove('open');
    }

    // ── Markdown & parsing helpers ────────────────────────────────────
    function decodeB64(b64) {
      return decodeURIComponent(escape(atob(b64.replace(/\n/g,''))));
    }

    function stripFrontmatter(md) {
      return md.replace(/^---[\s\S]*?---\n/, '').trim();
    }

    function parseFrontmatter(content) {
      const match = content.match(/^---\n([\s\S]*?)\n---/);
      if (!match) return {};
      const result = {};
      match[1].split('\n').forEach(line => {
        const idx = line.indexOf(':');
        if (idx > 0) result[line.slice(0,idx).trim()] = line.slice(idx+1).trim().replace(/^["']|["']$/g,'');
      });
      return result;
    }

    function parseSection(content, heading) {
      const re = new RegExp(`## ${heading}\\n([\\s\\S]*?)(?=\\n## |$)`);
      const m  = content.match(re);
      return m ? m[1].trim() : '';
    }

    function mdToHtml(md) {
      return md
        .replace(/^#### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^### (.+)$/gm,  '<h3>$1</h3>')
        .replace(/^## (.+)$/gm,   '<h2>$1</h2>')
        .replace(/^---$/gm,       '<hr>')
        .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
        .replace(/^[-•] (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>')
        .replace(/(<\/ul>)\s*(<ul>)/g, '')
        .replace(/^(?!<[huhl])/gm, '')
        .trim();
    }

    // ── Date chip ────────────────────────────────────────────────────
    function initDateChip() {
      [['nota-data','date-display'], ['pdf-data','pdf-date-display']].forEach(([inputId, displayId]) => {
        const input   = document.getElementById(inputId);
        const display = document.getElementById(displayId);
        const t       = new Date().toISOString().split('T')[0];
        input.value   = t;
        display.textContent = formatDate(t);
        input.addEventListener('change', () => {
          display.textContent = formatDate(input.value);
        });
      });
    }

    function openDatePicker(inputId, displayId) {
      const input = document.getElementById(inputId);
      try { input.showPicker(); } catch { input.click(); }
    }

    function formatDate(val) {
      if (!val) return '--/--/--';
      const [y, m, d] = val.split('-');
      return `${d}/${m}/${y.slice(2)}`;
    }


    // ── GitHub API ───────────────────────────────────────────────────
    function token() { return localStorage.getItem('gh_token'); }

    async function ghGet(path) {
      const r = await fetch(`${API_BASE}${path}`, {
        headers: { Authorization: `token ${token()}`, Accept: 'application/vnd.github.v3+json' }
      });
      if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.message||`HTTP ${r.status}`); }
      return r.json();
    }

    async function ghGraphQL(query) {
      const r = await fetch('https://api.github.com/graphql', {
        method: 'POST',
        headers: { Authorization: `token ${token()}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ query })
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const { data, errors } = await r.json();
      if (errors?.length) throw new Error(errors[0].message);
      return data;
    }

    async function ghPut(path, body) {
      const r = await fetch(`${API_BASE}${path}`, {
        method: 'PUT',
        headers: { Authorization: `token ${token()}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.message||`HTTP ${r.status}`); }
      return r.json();
    }

    function enc(path) { return path.split('/').map(encodeURIComponent).join('/'); }
    function toB64(str) { return btoa(unescape(encodeURIComponent(str))); }
    function sanitize(n) { return n.replace(/[/\\?%*:|"<>]/g,'-').trim(); }
    function today() { return new Date().toISOString().split('T')[0]; }

    // ── Connection ───────────────────────────────────────────────────
    async function checkConnection() {
      setStatus('pending', 'Conectando...');
      try {
        await ghGet(`/repos/${REPO}`);
        setStatus('ok', 'Conectado');
      } catch {
        setStatus('err', 'Falha na autenticação');
      }
    }

    function setStatus(state, text) {
      document.getElementById('status-dot').className       = `status-dot ${state}`;
      document.getElementById('status-card-title').textContent = text;
      document.getElementById('cfg-badge').classList.toggle('show', state === 'err');
    }

    // ── Token ────────────────────────────────────────────────────────
    function saveToken() {
      const val = document.getElementById('gh-token').value.trim();
      if (!val) return showToast('Digite um token', 'error');
      localStorage.setItem('gh_token', val);
      showToast('Token salvo!', 'success');
      checkConnection().then(() => loadPdfFolders());
    }

    function toggleToken() {
      const el = document.getElementById('gh-token');
      el.type = el.type === 'password' ? 'text' : 'password';
    }


    function onPdfDestinoChange() {
      const v = document.getElementById('pdf-destino').value;
      document.getElementById('pdf-custom-wrap').classList.toggle('show', v === 'custom');
    }

    // ── File input ───────────────────────────────────────────────────
    function onFileChange(input) {
      if (!input.files?.length) return;
      currentFile = input.files[0];
      const nameEl = document.getElementById('file-name');
      nameEl.textContent = currentFile.name;
      nameEl.style.display = 'block';
      document.getElementById('file-drop').classList.add('has-file');
      if (!document.getElementById('pdf-titulo').value)
        document.getElementById('pdf-titulo').value = currentFile.name.replace(/\.[^.]+$/,'');
    }

    // ── Submit: Nota ─────────────────────────────────────────────────
    document.getElementById('form-nota').addEventListener('submit', async e => {
      e.preventDefault();
      if (!token()) return showToast('Configure o token primeiro', 'error');
      const btn = document.getElementById('btn-nota');
      setBtnLoading(btn, 'Salvando...');
      try {
        const titulo   = document.getElementById('nota-titulo').value.trim();
        const data     = document.getElementById('nota-data').value;
        const conteudo = document.getElementById('nota-conteudo').value.trim();
        const destSel  = document.getElementById('nota-destino').value;
        const destino  = destSel === 'custom' ? document.getElementById('nota-custom').value.trim() : destSel;
        if (!destino) return showToast('Informe a categoria', 'error');

        const md = `---\ndata: ${data}\ndestino: ${destino}\ntipo: nota\n---\n\n# ${titulo}\n\n${conteudo}`;
        await ghPut(`/repos/${REPO}/contents/${enc(`${destino}/${data} - ${sanitize(titulo)}.md`)}`, {
          message: `📝 ${titulo}`, content: toB64(md)
        });

        showToast('Nota salva! ✓', 'success');
        document.getElementById('nota-titulo').value  = '';
        document.getElementById('nota-conteudo').value = '';
      } catch (err) {
        showToast('Erro: ' + err.message, 'error');
      } finally {
        setBtnReady(btn, 'Salvar');
      }
    });

    // ── Submit: Anexo ────────────────────────────────────────────────
    document.getElementById('form-pdf').addEventListener('submit', async e => {
      e.preventDefault();
      if (!token())      return showToast('Configure o token primeiro', 'error');
      if (!currentFile)  return showToast('Selecione um arquivo', 'error');
      const btn = document.getElementById('btn-pdf');
      setBtnLoading(btn, 'Enviando...');
      try {
        const titulo  = document.getElementById('pdf-titulo').value.trim();
        const destSel = document.getElementById('pdf-destino').value;
        const destino = destSel === 'custom'
          ? 'ANEXOS/' + document.getElementById('pdf-custom').value.trim()
          : destSel;
        if (!destino || destino === 'ANEXOS/') return showToast('Informe a categoria', 'error');

        const ext        = currentFile.name.split('.').pop();
        const safeName   = sanitize(titulo);
        const anotacoes  = document.getElementById('pdf-anotacoes').value.trim();
        const data       = document.getElementById('pdf-data').value;
        const b64        = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload  = () => res(r.result.split(',')[1]);
          r.onerror = rej;
          r.readAsDataURL(currentFile);
        });

        await ghPut(`/repos/${REPO}/contents/${enc(`${destino}/${safeName}.${ext}`)}`, {
          message: `📎 ${titulo}`, content: b64
        });

        // Companion .md com anotações
        const noteMd = `---\ndata: ${data}\ntipo: arquivo\n---\n\n# ${titulo}\n\nArquivo: \`${safeName}.${ext}\`\n${anotacoes ? '\n## Anotações\n\n' + anotacoes : ''}`;
        await ghPut(`/repos/${REPO}/contents/${enc(`${destino}/${safeName}.md`)}`, {
          message: `📎 nota: ${titulo}`, content: toB64(noteMd)
        }).catch(() => {});

        showToast('Arquivo enviado! ✓', 'success');
        currentFile = null;
        document.getElementById('pdf-file').value      = '';
        document.getElementById('pdf-titulo').value    = '';
        document.getElementById('pdf-anotacoes').value = '';
        document.getElementById('file-name').style.display = 'none';
        document.getElementById('file-drop').classList.remove('has-file');
      } catch (err) {
        showToast('Erro: ' + err.message, 'error');
      } finally {
        setBtnReady(btn, 'Enviar');
      }
    });

    // ── Custom folder toggles ────────────────────────────────────────
    document.getElementById('nota-destino').addEventListener('change', function() {
      document.getElementById('nota-custom-wrap').classList.toggle('show', this.value === 'custom');
    });

    // ── Tab switching ────────────────────────────────────────────────
    function switchTab(tab) {
      if (tab === currentTab) return;
      haptic(8);
      const fromIdx = TAB_ORDER.indexOf(currentTab);
      const toIdx   = TAB_ORDER.indexOf(tab);
      const dir     = toIdx > fromIdx ? 'slide-left' : 'slide-right';

      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active','slide-left','slide-right'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      const panel = document.getElementById(`panel-${tab}`);
      panel.classList.add('active', dir);
      document.getElementById(`tab-${tab}`).classList.add('active');
      currentTab = tab;
      document.getElementById('scroll-area').scrollTop = 0;
    }

    // ── Helpers ──────────────────────────────────────────────────────
    function haptic(ms=10) { if (navigator.vibrate) navigator.vibrate(ms); }

    let _tt;
    function showToast(msg, type='success') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `toast ${type} show`;
      clearTimeout(_tt);
      _tt = setTimeout(() => el.classList.remove('show'), 3200);
    }

    function setBtnLoading(btn, label) {
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span>${label}`;
    }
    function setBtnReady(btn, label) {
      btn.disabled = false;
      btn.textContent = label;
    }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

    init();
  </script>
</body>
</html>
